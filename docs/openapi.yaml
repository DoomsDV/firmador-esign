openapi: 3.0.3
info:
  title: Plataforma de Facturación Electrónica (SIFEN) multi-tenant
  version: "1.0.0"
  description: |
    API de la plataforma esign. Tres planos:

    - **Panel** (`{ORDS}/api/v1`, Bearer JWT): gestión del negocio desde el frontend futuro.
    - **Emisión** (`{GO}/v1`, Bearer `sk_test_`/`sk_prod_`): firma y envío de documentos a SIFEN.
    - **Interno** (`{ORDS}/internal/v1`, header `X-Service-Token`): solo el servicio Go lo consume.

    El **ambiente SIFEN** (test/prod) lo determina exclusivamente el prefijo de la API key
    (`sk_test_` → SIFEN-test, `sk_prod_` → SIFEN-prod). Todas las respuestas usan el envelope
    estándar `{ success, data, error, meta }`.

servers:
  - url: http://localhost:8080
    description: Emisión (servidor Go)
  - url: https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign
    description: Panel e Interno (ORDS)

tags:
  - name: Emisión
    description: Motor Go. Bearer sk_test_/sk_prod_.
  - name: Panel - Auth
    description: Registro, login, selección de negocio, invitaciones. Bearer JWT.
  - name: Panel - Cliente
    description: Identidad del negocio, emisor, establecimientos, ambientes.
  - name: Panel - API keys
    description: Gestión de API keys (rotables).
  - name: Panel - Certificado
    description: Subida/metadata del certificado .p12.
  - name: Panel - Documentos
    description: Consulta de documentos emitidos.
  - name: Interno
    description: Contrato Go↔ORDS. Header X-Service-Token.

security:
  - bearerApiKey: []

paths:
  # --------------------------------------------------------------------------
  # EMISIÓN (Go /v1)
  # --------------------------------------------------------------------------
  /v1/health:
    get:
      tags: [Emisión]
      summary: Salud del servicio
      security: []
      responses:
        "200":
          description: Servicio operativo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /v1/documents:
    post:
      tags: [Emisión]
      summary: Crear, firmar y enviar un documento electrónico (FE/NCE/NDE)
      description: |
        Resuelve el tenant por la API key, valida establecimiento/punto, pide el correlativo,
        genera el CDC, firma con el certificado descifrado y envía a SIFEN (test o prod según
        el prefijo de la key). Persiste el resultado. `201` si SIFEN aprueba (0260); `200` si
        rechaza (el detalle va en `data`).
      security:
        - bearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDocumentRequest" }
            examples:
              feInnominado:
                summary: FE contado, receptor innominado, PYG
                value:
                  tipo: fe
                  condicion: contado
                  datos_operacion: { establecimiento: "001", punto_expedicion: "001" }
                  receptor: { tipo: innominado }
                  moneda: PYG
                  items:
                    - { codigo: "SERV-001", descripcion: "Servicio profesional", cantidad: 1, precioUnitario: 150000, afectacionIVA: 1, tasaIVA: 10 }
      responses:
        "201":
          description: Documento aprobado por SIFEN (0260)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResponseEnvelope" }
        "200":
          description: Documento rechazado por SIFEN (código distinto de 0260)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResponseEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/documents/{cdc}/cancel:
    post:
      tags: [Emisión]
      summary: Emitir un evento de cancelación sobre un CDC
      security:
        - bearerApiKey: []
      parameters:
        - name: cdc
          in: path
          required: true
          description: CDC (44 dígitos) del documento aprobado a cancelar
          schema: { type: string, minLength: 44, maxLength: 44 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 5, maxLength: 500, example: "Error en los datos del documento" }
      responses:
        "200":
          description: Resultado del evento (REGISTRADO si 0600)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventResponseEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/events/inutilizacion:
    post:
      tags: [Emisión]
      summary: Inutilizar un rango de numeración
      security:
        - bearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InutilizacionRequest" }
      responses:
        "200":
          description: Resultado del evento (REGISTRADO si 0600)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventResponseEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # --------------------------------------------------------------------------
  # PANEL → GO (mediación de secretos). Bearer JWT del panel. Solo owner.
  # Go cifra con ESIGN_MASTER_KEY y persiste vía ORDS interno.
  # --------------------------------------------------------------------------
  /v1/panel/certificate:
    post:
      tags: [Panel - Certificado]
      summary: Subir .p12 + password en claro (Go cifra y guarda)
      description: |
        El navegador envía el P12 (base64) y la password en claro. Go cifra con AES-256-GCM
        (`ESIGN_MASTER_KEY`) y guarda vía `POST /internal/v1/certificate/store`.
        El panel NUNCA cifra ni ve la master key.
      security: [{ bearerJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PanelCertificateUploadRequest" }
      responses:
        "200":
          description: Certificado almacenado (cifrado)
          content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/panel/environments:
    put:
      tags: [Panel - Cliente]
      summary: Upsert timbrado + CSC en claro (Go cifra el CSC y guarda)
      description: |
        El navegador envía timbrado/CSC en claro. Go cifra el CSC y persiste vía
        `POST /internal/v1/environments/store`. Scopeado por ambiente TEST/PROD.
      security: [{ bearerJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PanelEnvironmentUpsertRequest" }
      responses:
        "200":
          description: Ambiente actualizado
          content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # --------------------------------------------------------------------------
  # PANEL (ORDS /api/v1) — usar el server ORDS
  # --------------------------------------------------------------------------
  /api/v1/auth/register:
    post:
      tags: [Panel - Auth]
      summary: Registrar usuario + negocio (membresía owner)
      security: []
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: Registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/v1/auth/login:
    post:
      tags: [Panel - Auth]
      summary: Login (devuelve la lista de negocios para elegir)
      security: []
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Usuario + lista de clients
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/v1/auth/select-client:
    post:
      tags: [Panel - Auth]
      summary: Elegir negocio y emitir el JWT
      security: []
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, client_id]
              properties:
                user_id: { type: integer }
                client_id: { type: integer }
      responses:
        "200":
          description: Tokens de acceso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/v1/invitations:
    post:
      tags: [Panel - Auth]
      summary: Crear invitación (base para envío por correo)
      description: Crea una invitación PENDING con token + expiración. El envío del correo y la aceptación quedan pendientes.
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [owner, developer, analyst] }
      responses:
        "200":
          description: Invitación creada (INVITE_PENDING + token)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/v1/client:
    get:
      tags: [Panel - Cliente]
      summary: Identidad del negocio + emisor
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
    put:
      tags: [Panel - Cliente]
      summary: Upsert del emisor (solo owner)
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }

  /api/v1/establecimientos:
    get:
      tags: [Panel - Cliente]
      summary: Lista de sucursales con geo
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
    post:
      tags: [Panel - Cliente]
      summary: Alta/actualización de sucursal (solo owner)
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EstablecimientoRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }

  /api/v1/establecimientos/{codigo}/puntos:
    post:
      tags: [Panel - Cliente]
      summary: Alta/actualización de punto de expedición (solo owner)
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      parameters:
        - name: codigo
          in: path
          required: true
          description: Código del establecimiento (ej. 001)
          schema: { type: string, example: "001" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PuntoExpedicionRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/environments:
    put:
      tags: [Panel - Cliente]
      summary: Upsert timbrado + CSC cifrado por ambiente (solo owner)
      description: |
        Recibe el CSC YA cifrado (hex). El panel no debe llamar este endpoint con el CSC en claro:
        usar `PUT /v1/panel/environments` en Go (mediación de cifrado).
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EnvironmentRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }

  /api/v1/api-keys:
    get:
      tags: [Panel - API keys]
      summary: Lista de API keys (prefijo/ambiente/estado; nunca la key completa)
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }

  /api/v1/api-keys/{env}/rotate:
    post:
      tags: [Panel - API keys]
      summary: Rotar la API key de un ambiente (muestra la key UNA sola vez)
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      parameters:
        - name: env
          in: path
          required: true
          schema: { type: string, enum: [test, prod] }
      responses:
        "200":
          description: Key nueva (única vez que se ve completa)
          content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }

  /api/v1/certificate:
    get:
      tags: [Panel - Certificado]
      summary: Metadata del certificado ACTIVE (nunca el BLOB)
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Panel - Certificado]
      summary: Subir P12 cifrado + password cifrado (solo owner)
      description: |
        Recibe ciphertext+nonce YA cifrados. El panel no debe llamar este endpoint con el
        P12 en claro: usar `POST /v1/panel/certificate` en Go (mediación de cifrado).
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CertificateRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/documents/search:
    post:
      tags: [Panel - Documentos]
      summary: Listado paginado de documentos (filtros en el body)
      description: |
        Endpoint de listado recomendado. Los filtros van en el body porque esta instancia
        ORDS no liga query-params de forma fiable (ORDS-25001). `estado`/`tipo` en null no filtran.
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment]
              properties:
                environment: { type: string, enum: [TEST, PROD] }
                estado: { type: string, nullable: true, enum: [BORRADOR, FIRMADO, ENVIADO, APROBADO, RECHAZADO, CANCELADO] }
                tipo: { type: integer, nullable: true }
                page: { type: integer, default: 1 }
                pageSize: { type: integer, default: 20 }
      responses:
        "200":
          description: Listado con meta de paginacion (page/pageSize/total)
          content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/documents:
    get:
      tags: [Panel - Documentos]
      summary: "[DEPRECADO] Listado por query-params"
      deprecated: true
      description: |
        No usar: los query-params no ligan de forma fiable en esta instancia ORDS (ORDS-25001).
        Usar POST /api/v1/documents/search con los filtros en el body.
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      parameters:
        - { name: environment, in: query, schema: { type: string, enum: [TEST, PROD] } }
        - { name: estado, in: query, schema: { type: string } }
        - { name: tipo, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }

  /api/v1/documents/{cdc}:
    get:
      tags: [Panel - Documentos]
      summary: Detalle de un documento
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      parameters:
        - { name: cdc, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/documents/{cdc}/xml:
    get:
      tags: [Panel - Documentos]
      summary: Descargar el XML firmado (application/xml)
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      parameters:
        - { name: cdc, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: XML firmado tal cual se envio a SIFEN (regla 0141)
          content:
            application/xml:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/documents/{cdc}/retry:
    post:
      tags: [Panel - Documentos]
      summary: Marcar un documento FIRMADO para reenvio a SIFEN
      description: |
        Marca `retry_requested=1` en un documento en estado FIRMADO (fallo transitorio de envio).
        El worker de Go lo reintenta. Solo aplica a FIRMADO; otros estados devuelven 400.
      security: [{ bearerJWT: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      parameters:
        - { name: cdc, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Documento marcado para reenvio
          content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }
        "400": { $ref: "#/components/responses/Unprocessable" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------------------
  # INTERNO (ORDS /internal/v1) — solo el servicio Go. Header X-Service-Token.
  # --------------------------------------------------------------------------
  /internal/v1/context:
    post:
      tags: [Interno]
      summary: Resolver API key → client_id + config + establecimientos
      security: [{ serviceToken: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties: { api_key: { type: string, example: "sk_test_..." } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /internal/v1/next-number:
    post:
      tags: [Interno]
      summary: Correlativo con bloqueo para (est, punto, tipo_de)
      security: [{ serviceToken: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, environment, establecimiento, punto_expedicion, tipo_de]
              properties:
                client_id: { type: integer }
                environment: { type: string, enum: [TEST, PROD] }
                establecimiento: { type: string }
                punto_expedicion: { type: string }
                tipo_de: { type: integer }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }

  /internal/v1/certificate:
    post:
      tags: [Interno]
      summary: Blobs cifrados del certificado ACTIVE (hex)
      security: [{ serviceToken: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [client_id], properties: { client_id: { type: integer } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }

  /internal/v1/csc:
    post:
      tags: [Interno]
      summary: CSC cifrado (hex) del ambiente para el QR
      security: [{ serviceToken: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [client_id, environment], properties: { client_id: { type: integer }, environment: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }

  /internal/v1/logs:
    post:
      tags: [Interno]
      summary: Registrar una llamada en api_log (lo usa el middleware de Go)
      security: [{ serviceToken: [] }]
      servers: [{ url: "https://g9549f707e8ebfa-aoxdev.adb.sa-saopaulo-1.oraclecloudapps.com/ords/esign" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, http_status, latency_ms]
              properties:
                client_id: { type: integer }
                environment: { type: string }
                endpoint: { type: string }
                http_status: { type: integer }
                latency_ms: { type: integer }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }

components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      description: "API key del comercio: Authorization: Bearer sk_test_... / sk_prod_..."
    bearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT del panel emitido por /auth/select-client."
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: "Token compartido Go↔ORDS (app_parameter.SERVICE_TOKEN)."

  responses:
    Unauthorized:
      description: No autenticado / token inválido
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Forbidden:
      description: Sin permiso (rol o key revocada/cliente inactivo)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFound:
      description: Recurso inexistente
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Unprocessable:
      description: Payload válido pero inconsistente (validación de negocio)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    BadGateway:
      description: Error al comunicarse con SIFEN u ORDS
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  schemas:
    Envelope:
      type: object
      description: Envelope estándar de éxito.
      properties:
        success: { type: boolean, example: true }
        data: { nullable: true, description: Objeto o arreglo con el resultado }
        error: { nullable: true, example: null }
        meta:
          type: object
          nullable: true
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
      required: [success]

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        data: { nullable: true, example: null }
        error:
          type: object
          properties:
            code: { type: string, example: "UNAUTHORIZED" }
            message: { type: string, example: "falta Authorization: Bearer ..." }
      required: [success, error]

    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                status: { type: string, example: ok }
                time: { type: string, format: date-time }

    Geo:
      type: object
      properties:
        cod: { type: integer, example: 12 }
        desc: { type: string, example: CENTRAL }

    ReceptorRequest:
      type: object
      properties:
        tipo: { type: string, enum: [ci, ruc, innominado, extranjero] }
        documento: { type: string }
        dv: { type: integer, description: "DV (receptor RUC)" }
        tipoContribuyente: { type: integer, description: "1 física, 2 jurídica (RUC)" }
        tipoOperacion: { type: integer, description: "iTiOpe (RUC)" }
        nombre: { type: string }
        pais: { type: string, description: "ISO-3 ≠ PRY (extranjero)" }
        desPais: { type: string }
        tipoIdentificacion: { type: integer, description: "iTipIDRec (extranjero)" }
      required: [tipo]

    ItemRequest:
      type: object
      properties:
        codigo: { type: string, example: "SERV-001" }
        descripcion: { type: string }
        cantidad: { type: number, example: 1 }
        precioUnitario: { type: number, example: 150000 }
        afectacionIVA: { type: integer, enum: [1, 2, 3, 4], description: "1 gravado, 2 exonerado, 3 exento, 4 parcial" }
        tasaIVA: { type: integer, enum: [10, 5, 0] }
        unidadMedida: { type: integer }
        desUnidadMedida: { type: string }
        propIVA: { type: number, description: "gravado parcial" }
      required: [descripcion, cantidad, precioUnitario, afectacionIVA, tasaIVA]

    CreateDocumentRequest:
      type: object
      properties:
        tipo: { type: string, enum: [fe, nce, nde], example: fe }
        condicion: { type: string, enum: [contado, credito], example: contado }
        plazo: { type: string, description: "días (crédito a plazo)", example: "30" }
        datos_operacion:
          type: object
          properties:
            establecimiento: { type: string, example: "001" }
            punto_expedicion: { type: string, example: "001" }
        receptor: { $ref: "#/components/schemas/ReceptorRequest" }
        moneda: { type: string, example: PYG }
        tipoCambio: { type: number, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemRequest" }
        cdcRef: { type: string, description: "NCE/NDE: CDC de la factura referenciada" }
        motivo: { type: integer, description: "NCE/NDE: motivo de emisión" }
      required: [tipo, moneda, items]

    DocumentResponseEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                cdc: { type: string, example: "01060389648001001000000812026072514730603957" }
                estado: { type: string, enum: [APROBADO, RECHAZADO, FIRMADO], example: APROBADO }
                codRes: { type: string, example: "0260" }
                protAut: { type: string, example: "49767439" }
                mensaje: { type: string }
                qr: { type: string }
                numeroDocumento: { type: string, example: "0000008" }
                ambiente: { type: string, example: test }

    InutilizacionRequest:
      type: object
      properties:
        establecimiento: { type: string, example: "001" }
        punto_expedicion: { type: string, example: "001" }
        numeroInicial: { type: integer, example: 1000 }
        numeroFinal: { type: integer, example: 1005 }
        tipoDE: { type: integer, example: 1 }
        motivo: { type: string, minLength: 5, maxLength: 500 }
      required: [numeroInicial, numeroFinal, tipoDE, motivo]

    EventResponseEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                estado: { type: string, enum: [REGISTRADO, RECHAZADO], example: REGISTRADO }
                codRes: { type: string, example: "0600" }
                protAut: { type: string }
                mensaje: { type: string }
                ambiente: { type: string, example: test }

    RegisterRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        first_name: { type: string }
        last_name: { type: string }
        business_name: { type: string }
        ruc: { type: string }
        dv: { type: integer }
      required: [email, password, business_name, ruc]

    EstablecimientoRequest:
      type: object
      properties:
        codigo: { type: string, example: "001" }
        denominacion: { type: string }
        direccion: { type: string }
        num_casa: { type: string, example: "0" }
        dep: { $ref: "#/components/schemas/Geo" }
        dis: { $ref: "#/components/schemas/Geo" }
        ciu: { $ref: "#/components/schemas/Geo" }
        telefono: { type: string }
        email: { type: string }
      required: [codigo, direccion, dep, ciu]

    PuntoExpedicionRequest:
      type: object
      properties:
        codigo: { type: string, example: "001" }
        descripcion: { type: string, example: "Caja 1" }
        is_active: { type: integer, enum: [0, 1], default: 1 }
      required: [codigo]

    PanelCertificateUploadRequest:
      type: object
      description: Payload del panel hacia Go. Go cifra antes de persistir.
      properties:
        p12_base64: { type: string, description: "Contenido del .p12 en base64" }
        password: { type: string, format: password, description: "Password del P12 en claro" }
        subject_dn: { type: string, description: "Opcional; Go puede derivarlo del P12" }
        not_after: { type: string, format: date-time, description: "Opcional; Go puede derivarlo del P12" }
      required: [p12_base64, password]

    PanelEnvironmentUpsertRequest:
      type: object
      description: Payload del panel hacia Go. Go cifra el CSC antes de persistir.
      properties:
        environment: { type: string, enum: [TEST, PROD] }
        num_timbrado: { type: string, example: "06038964" }
        fecha_inicio_vigencia: { type: string, format: date, example: "2026-07-09" }
        id_csc: { type: string, example: "0001" }
        csc: { type: string, description: "CSC en claro (32 hex chars típicos de SET)" }
      required: [environment, num_timbrado, fecha_inicio_vigencia, id_csc, csc]

    EnvironmentRequest:
      type: object
      description: El CSC llega YA cifrado (hex) por el cliente/Go; ORDS nunca ve el claro.
      properties:
        environment: { type: string, enum: [TEST, PROD] }
        num_timbrado: { type: string, example: "06038964" }
        fecha_inicio_vigencia: { type: string, format: date, example: "2026-07-09" }
        id_csc: { type: string, example: "0001" }
        csc_ciphertext: { type: string, description: hex }
        csc_nonce: { type: string, description: hex }
        key_version: { type: integer, example: 1 }
      required: [environment, num_timbrado, fecha_inicio_vigencia, id_csc, csc_ciphertext, csc_nonce]

    CertificateRequest:
      type: object
      description: P12 y password YA cifrados (AES-256-GCM) por el cliente.
      properties:
        subject_dn: { type: string }
        not_after: { type: string, format: date-time }
        p12_ciphertext: { type: string, description: hex }
        p12_nonce: { type: string, description: hex }
        pwd_ciphertext: { type: string, description: hex }
        pwd_nonce: { type: string, description: hex }
        key_version: { type: integer, example: 1 }
      required: [p12_ciphertext, p12_nonce, pwd_ciphertext, pwd_nonce]
